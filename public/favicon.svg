<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04100D" />
      <stop offset="100%" stop-color="#0A2920" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#10B981" stroke-width="2" stroke-opacity="0.3"/>
  <!-- Scanner Hexagon Shield -->
  <polygon points="50,18 80,32 80,68 50,82 20,68 20,32" fill="none" stroke="url(#emeraldGrad)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Glowing Center AI Eye Pulse -->
  <circle cx="50" cy="50" r="14" fill="url(#cyanGrad)"/>
  <circle cx="50" cy="50" r="6" fill="#FFFFFF"/>
  <!-- Scan Radar Line -->
  <line x1="24" y1="50" x2="76" y2="50" stroke="#10B981" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>
